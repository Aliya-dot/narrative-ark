[package]
name = "narrative-ark"
version = "0.1.5"
description = "叙界 / Narrative Ark"
authors = ["Narrative Ark Contributors"]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.77.2"

[lib]
name = "narrative_ark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-http = "2.5.9"
tauri-plugin-keyring-store = { version = "0.2.0", default-features = false }
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
rusqlite = { version = "0.37.0", features = ["bundled", "backup"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-process = "2.3.0"
tauri-plugin-updater = "2.10.0"
